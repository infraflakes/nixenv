theme = "tokyo"

[editor]
file-picker.hidden = false
end-of-line-diagnostics = "hint"
clipboard-provider = "termcode"
idle-timeout = 5
completion-timeout = 5
completion-trigger-len = 1

[editor.soft-wrap]
enable = true

[editor.lsp]
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
";" = "command_mode"
